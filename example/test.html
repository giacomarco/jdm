<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jdm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        pre {
            margin: 0;
        }
        .box {
            margin-top: 1rem;
            border: 1px solid #cccccc;
        }
        .code {
            background-color: #333333;
            color: white;
        }
        .text-orange {
            color: darkorange;
        }
        .text-yellow {
            color: yellow;
        }
        .text-green {
            color: greenyellow;
        }
        .text-cyan {
            color: deepskyblue;
        }
    </style>
</head>
<body>
<jdm-element></jdm-element>
<script src="../dist/jdm.js"></script>
<script>

    const classList = ['foo', 'bar', 'baz'];

    const box = JDM(
        //language=HTML
        `<div class="box">
            <h1 data-name="header"></h1>
            <hr>
            <div data-name="content"></div>
            <div data-name="footer"></div>
        </div>
        `).jdm_extendChildNode()

    box.header.jdm_innerHTML('test')
        .jdm_onRightClick(()=> {
            console.log('right click')
        })






</script>
</body>
</html>
